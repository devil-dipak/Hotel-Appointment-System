<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment System - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-hospital"></i> Hospital System</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="patients.html">Patients</a></li>
                    <li class="nav-item"><a class="nav-link" href="appointments.html">Appointments</a></li>
                    <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" id="userNameLink">User</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" id="loginLink"><a class="nav-link" href="/">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Hospital Dashboard</h2>
        <div class="row" id="statsCards">
            <div class="col-md-4 mb-3">
                <div class="card text-bg-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title">Doctors</h5>
                                <h2 id="totalDoctors">0</h2>
                            </div>
                            <i class="bi bi-person-badge fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-bg-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title">Patients</h5>
                                <h2 id="totalPatients">0</h2>
                            </div>
                            <i class="bi bi-people fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-bg-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title">Appointments</h5>
                                <h2 id="totalAppointments">0</h2>
                            </div>
                            <i class="bi bi-calendar-check fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
         <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card text-bg-info">
                    <div class="card-body">
                        <h5 class="card-title">Scheduled</h5>
                        <h2 id="scheduledAppointments">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">Completed</h5>
                        <h2 id="completedAppointments">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">Cancelled</h5>
                        <h2 id="cancelledAppointments">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-calendar-day"></i> Today's Appointments</h5>
                        <span class="badge bg-primary" id="todayCount">0</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Time</th>
                                        <th>Doctor</th>
                                        <th>Patient</th>
                                        <th>Reason</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="todayTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        fetch('/api/dashboard/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('totalDoctors').textContent = data.totalDoctors;
                document.getElementById('totalPatients').textContent = data.totalPatients;
                document.getElementById('totalAppointments').textContent = data.totalAppointments;
                document.getElementById('scheduledAppointments').textContent = data.scheduledAppointments;
                document.getElementById('completedAppointments').textContent = data.completedAppointments;
                document.getElementById('cancelledAppointments').textContent = data.cancelledAppointments;
            });

        fetch('/api/appointments/today')
            .then(r => r.json())
            .then(data => {
                document.getElementById('todayCount').textContent = data.length;
                const tbody = document.getElementById('todayTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No appointments today</td></tr>';
                } else {
                    tbody.innerHTML = data.map(a => `
                        <tr>
                            <td>${a.appointmentTime}</td>
                            <td>${a.doctor?.name || '-'}</td>
                            <td>${a.patient?.name || '-'}</td>
                            <td>${a.reason || '-'}</td>
                            <td><span class="badge ${a.status === 'SCHEDULED' ? 'bg-warning' : a.status === 'COMPLETED' ? 'bg-success' : 'bg-danger'}">${a.status}</span></td>
                        </tr>
                    `).join('');
                }
            });
    </script>
</body>
</html>
