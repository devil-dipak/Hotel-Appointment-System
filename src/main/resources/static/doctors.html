<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-hospital"></i> Hospital System</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="doctors.html">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="patients.html">Patients</a></li>
                    <li class="nav-item"><a class="nav-link" href="appointments.html">Appointments</a></li>
                    <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" id="userNameLink">User</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" id="loginLink"><a class="nav-link" href="/">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Manage Doctors</h2>
            <button class="btn btn-primary" id="addDoctorBtn" data-bs-toggle="modal" data-bs-target="#doctorModal" onclick="resetDoctorForm()">
                <i class="bi bi-plus-circle"></i> Add Doctor
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th id="thEmail">Email</th>
                        <th id="thPhone">Phone</th>
                        <th id="thDays">Available Days</th>
                        <th id="thTiming">Timing</th>
                        <th id="thActions">Actions</th>
                    </tr>
                </thead>
                <tbody id="doctorTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="doctorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="doctorModalTitle">Add Doctor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="doctorForm">
                        <input type="hidden" id="doctorId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="doctorName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <input type="text" class="form-control" id="doctorSpecialization" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="doctorEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="doctorPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Available Days</label>
                            <input type="text" class="form-control" id="doctorDays" placeholder="e.g. Mon-Fri">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Time</label>
                                <input type="text" class="form-control" id="doctorTimeStart" placeholder="e.g. 09:00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">End Time</label>
                                <input type="text" class="form-control" id="doctorTimeEnd" placeholder="e.g. 17:00">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveDoctor()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        const _user = JSON.parse(localStorage.getItem('user') || '{}');
        const _role = _user.role || '';

        if (_role === 'PATIENT') {
            document.getElementById('thEmail').style.display = 'none';
            document.getElementById('thPhone').style.display = 'none';
            document.getElementById('thDays').style.display = 'none';
            document.getElementById('thTiming').style.display = 'none';
            document.getElementById('thActions').style.display = 'none';
            document.getElementById('addDoctorBtn').style.display = 'none';
        }
        if (_role !== 'ADMIN') {
            document.getElementById('addDoctorBtn').style.display = 'none';
        }

        function loadDoctors() {
            fetch('/api/doctors')
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('doctorTableBody');
                    const isPatient = _role === 'PATIENT';
                    tbody.innerHTML = data.map(d => `
                        <tr>
                            <td>${d.id}</td>
                            <td>${d.name}</td>
                            <td><span class="badge bg-info">${d.specialization}</span></td>
                            <td style="${isPatient ? 'display:none' : ''}">${d.email}</td>
                            <td style="${isPatient ? 'display:none' : ''}">${d.phone || '-'}</td>
                            <td style="${isPatient ? 'display:none' : ''}">${d.availableDays || '-'}</td>
                            <td style="${isPatient ? 'display:none' : ''}">${d.availableTimeStart || '-'} - ${d.availableTimeEnd || '-'}</td>
                            <td style="${isPatient ? 'display:none' : ''}">
                                <button class="btn btn-sm btn-warning me-1" onclick="editDoctor(${d.id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="deleteDoctor(${d.id})"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function resetDoctorForm() {
            document.getElementById('doctorId').value = '';
            document.getElementById('doctorForm').reset();
            document.getElementById('doctorModalTitle').textContent = 'Add Doctor';
        }

        function editDoctor(id) {
            fetch(`/api/doctors/${id}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('doctorId').value = d.id;
                    document.getElementById('doctorName').value = d.name;
                    document.getElementById('doctorSpecialization').value = d.specialization;
                    document.getElementById('doctorEmail').value = d.email;
                    document.getElementById('doctorPhone').value = d.phone || '';
                    document.getElementById('doctorDays').value = d.availableDays || '';
                    document.getElementById('doctorTimeStart').value = d.availableTimeStart || '';
                    document.getElementById('doctorTimeEnd').value = d.availableTimeEnd || '';
                    document.getElementById('doctorModalTitle').textContent = 'Edit Doctor';
                    new bootstrap.Modal(document.getElementById('doctorModal')).show();
                });
        }

        function saveDoctor() {
            const id = document.getElementById('doctorId').value;
            const doctor = {
                name: document.getElementById('doctorName').value,
                specialization: document.getElementById('doctorSpecialization').value,
                email: document.getElementById('doctorEmail').value,
                phone: document.getElementById('doctorPhone').value,
                availableDays: document.getElementById('doctorDays').value,
                availableTimeStart: document.getElementById('doctorTimeStart').value,
                availableTimeEnd: document.getElementById('doctorTimeEnd').value
            };
            const url = id ? `/api/doctors/${id}` : '/api/doctors';
            const method = id ? 'PUT' : 'POST';
            fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(doctor) })
                .then(() => { bootstrap.Modal.getInstance(document.getElementById('doctorModal')).hide(); loadDoctors(); });
        }

        function deleteDoctor(id) {
            if (confirm('Delete this doctor?')) {
                fetch(`/api/doctors/${id}`, {method: 'DELETE'})
                    .then(() => loadDoctors());
            }
        }

        loadDoctors();
    </script>
</body>
</html>
