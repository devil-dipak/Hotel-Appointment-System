<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Hospital System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-hospital"></i> Hospital System</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                    <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                    <li class="nav-item dropdown" id="userDropdown" style="display:none;">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" id="userNameLink">User</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </li>
                    <li class="nav-item" id="loginLink"><a class="nav-link" href="/">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">My Profile</h2>
        <div id="alertBox"></div>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><h5>Update Profile</h5></div>
                    <div class="card-body">
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" id="profileName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="profileEmail" readonly>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><h5>Change Password</h5></div>
                    <div class="card-body">
                        <form id="passwordForm">
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control" id="newPassword" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Update Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = '/';

        document.getElementById('profileName').value = user.name || '';
        document.getElementById('profileEmail').value = user.email || '';

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/profile/' + user.id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: document.getElementById('profileName').value})
            })
            .then(r => r.json())
            .then(data => {
                if (data.message) {
                    user.name = data.name;
                    localStorage.setItem('user', JSON.stringify(user));
                    document.getElementById('alertBox').innerHTML = `<div class="alert alert-success">Profile updated</div>`;
                    document.getElementById('userNameLink').textContent = user.name;
                }
            });
        });

        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pw = document.getElementById('newPassword').value;
            if (pw !== document.getElementById('confirmPassword').value) {
                return document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">Passwords do not match</div>`;
            }
            fetch('/api/profile/' + user.id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pw})
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('alertBox').innerHTML = `<div class="alert alert-success">Password updated</div>`;
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            });
        });
    </script>
</body>
</html>
